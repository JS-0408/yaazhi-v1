# ─── Yaazhi Multi-VPS Split Compose (Instabox.sh / Multi-Account Ready) ─────
# Use Docker Compose profiles to split heavy services across separate small VPS
# instances (even under different accounts connected via Tailscale or external DBs):
#
#   Machine 1 (Memory & Database Box — ~2-4 GB RAM):
#     docker compose -f infra/docker-compose.instabox.yml --profile data up -d
#
#   Machine 2 (Ollama Embeddings Box — ~2-4 GB RAM):
#     docker compose -f infra/docker-compose.instabox.yml --profile ollama up -d
#     docker exec -it yaazhi-ollama ollama pull nomic-embed-text
#
#   Machine 3, 4... (Yaazhi API & Agent Worker Boxes — ~2-4 GB RAM):
#     docker compose -f infra/docker-compose.instabox.yml --profile api up -d --build

volumes:
  pgdata:
  redis_data:
  ollama_data:

services:
  # ── Profile: data (Machine 1) ───────────────────────────────────────────────
  yaazhi-postgres:
    image: pgvector/pgvector:pg16
    container_name: yaazhi-postgres
    profiles: ["data", "all"]
    ports:
      # Bind to Tailscale IP or localhost (set DB_BIND_IP=100.x.y.z in .env)
      - "${DB_BIND_IP:-127.0.0.1}:5432:5432"
    environment:
      POSTGRES_USER: yaazhi
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: yaazhi_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./init_v4.sql:/docker-entrypoint-initdb.d/02_init_v4.sql:ro
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yaazhi -d yaazhi_db"]
      interval: 20s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1536M

  yaazhi-redis:
    image: redis:7.2-alpine
    container_name: yaazhi-redis
    profiles: ["data", "all"]
    ports:
      - "${DB_BIND_IP:-127.0.0.1}:6379:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 640M

  # ── Profile: ollama (Machine 2) ─────────────────────────────────────────────
  yaazhi-ollama:
    image: ollama/ollama:latest
    container_name: yaazhi-ollama
    profiles: ["ollama", "all"]
    ports:
      - "${OLLAMA_BIND_IP:-127.0.0.1}:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 3G

  # ── Profile: api (Machine 3, 4...) ──────────────────────────────────────────
  yaazhi-api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: yaazhi-api-${YAAZHI_NODE_ID:-node-1}
    profiles: ["api", "all"]
    ports:
      - "8000:8000"
    env_file:
      - ../config/.env
    environment:
      YAAZHI_NODE_ID: "${YAAZHI_NODE_ID:-instabox-api-1}"
      VECTOR_BACKEND: "${VECTOR_BACKEND:-pgvector}"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 3G

