# nginx.conf — Yaazhi Reverse Proxy Configuration
# Proxies FastAPI (8000) and Streamlit dashboard (8501) behind a single nginx front.
# Cloudflare Tunnel exposes this container externally (no open ports needed).

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    # ── Performance ───────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml
               application/xml application/xml+rss text/javascript;

    # ── Rate limiting ─────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=voice:10m rate=10r/m;

    # ── Upstream services ─────────────────────────────────────
    upstream yaazhi_api {
        server yaazhi-api:8000;
        keepalive 32;
    }

    upstream yaazhi_dashboard {
        server yaazhi-dashboard:8501;
        keepalive 16;
    }

    # ─────────────────────────────────────────────────────────
    # HTTP → HTTPS redirect (only used if TLS terminates here,
    # not at Cloudflare Tunnel)
    # ─────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ─────────────────────────────────────────────────────────
    # Main server block
    # When using Cloudflare Tunnel, CF handles TLS — nginx only
    # needs to listen on 80 internally.
    # ─────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name yaazhi.yourdomain.com;          # ← replace with your domain

        # TLS certificates (Let's Encrypt or Cloudflare Origin cert)
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "microphone=(self)" always;

        client_max_body_size 100M;           # allow large document uploads

        # ── Yaazhi FastAPI ─────────────────────────────────
        location /api/ {
            limit_req zone=api burst=60 nodelay;

            proxy_pass         http://yaazhi_api/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection "";

            # WebSocket support (for streaming responses)
            proxy_set_header   Upgrade $http_upgrade;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ── Voice endpoints (longer timeout for Whisper STT) ──
        location /api/voice/ {
            limit_req zone=voice burst=5 nodelay;

            proxy_pass         http://yaazhi_api/voice/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
            client_max_body_size 25M;        # audio file size cap
        }

        # ── Streamlit Dashboard ───────────────────────────
        location / {
            proxy_pass         http://yaazhi_dashboard/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

            # Streamlit WebSocket (live component updates)
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_read_timeout 86400s;       # keep WS alive all day
        }

        # ── Static health check (no proxy needed) ────────
        location /nginx-health {
            access_log off;
            return 200 "nginx OK\n";
            add_header Content-Type text/plain;
        }

        # ── Block common exploit paths ────────────────────
        location ~* \.(env|git|htaccess|DS_Store)$ {
            deny all;
            return 404;
        }
    }
}
